name: Semgrep Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Scan hebdomadaire le lundi à 08h00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep OSS Scan
    runs-on: ubuntu-latest
    container:
      # Image officielle Semgrep — open-source uniquement
      image: semgrep/semgrep

    # Pas de SEMGREP_APP_TOKEN → mode offline, pas de Pro engine
    # Pas de --pro flag → moteur OSS garanti

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep — règles communautaires open-source
        run: |
          semgrep \
            --config .semgrep.yml \
            --config p/typescript \
            --config p/javascript \
            --config p/react \
            --config p/nextjs \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/jwt \
            --config p/secrets \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude "coverage" \
            --exclude "**/*.test.ts" \
            --exclude "**/*.spec.ts" \
            --exclude "**/*.test.tsx" \
            --exclude "**/*.spec.tsx" \
            --exclude "supabase/migrations" \
            --error \
            --json \
            --output semgrep-results.json
          # Pas de `|| true` : si semgrep plante (crash, config invalide
          # fatale), ce step doit échouer. Le step suivant fait le reste du
          # diagnostic (config errors, 0 fichier scanné) à partir du JSON,
          # dans tous les cas (if: always()).

      - name: Display results summary
        if: always()
        run: |
          if [ -f semgrep-results.json ]; then
            echo "=== Semgrep Results ==="
            python3 -c "
          import json, sys
          with open('semgrep-results.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          config_errors = data.get('errors', [])
          scanned = data.get('paths', {}).get('scanned', [])
          errors = [r for r in results if r.get('extra', {}).get('severity') == 'ERROR']
          warnings = [r for r in results if r.get('extra', {}).get('severity') == 'WARNING']
          print(f'Fichiers scannés: {len(scanned)}')
          print(f'Total findings: {len(results)}')
          print(f'  Errors:   {len(errors)}')
          print(f'  Warnings: {len(warnings)}')
          print(f'Erreurs de config/règle: {len(config_errors)}')
          if errors:
              print()
              print('ERROR findings:')
              for r in errors:
                  print(f'  [{r[\"check_id\"]}] {r[\"path\"]}:{r[\"start\"][\"line\"]}')
                  print(f'    {r[\"extra\"][\"message\"][:120]}')
          if config_errors:
              print()
              print('Erreurs de configuration/règle (empêchent potentiellement un scan complet) :')
              for e in config_errors:
                  print(f'  {e}')
          if not scanned:
              print()
              print('AUCUN FICHIER SCANNÉ — configuration invalide ou périmètre vide.')
          # Échoue si : des findings ERROR existent, OU des erreurs de
          # configuration/règle existent, OU aucun fichier n'a été scanné.
          # C'est ce dernier cas qui a laissé le scan inopérant 3 mois sans
          # que le job n'échoue jamais (0 scanned == 0 results == 'succès').
          sys.exit(1 if (errors or config_errors or not scanned) else 0)
          "
          else
            echo 'semgrep-results.json absent — le step de scan a probablement échoué avant de produire une sortie.'
            exit 1
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always()
        run: |
          semgrep \
            --config .semgrep.yml \
            --config p/typescript \
            --config p/javascript \
            --config p/react \
            --config p/nextjs \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/jwt \
            --config p/secrets \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude "coverage" \
            --sarif \
            --output semgrep.sarif \
            . || true

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30
